name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "tests/**", "samples/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "tests/**", "samples/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "0 6 * * 1" # Mondays: look for newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vendored libraries match pins, npm source and SRI; no known CVEs
        run: python tests/check_vendor.py --source --osv
      - name: Install Playwright (uses the runner's Chrome, no browser download)
        run: pip install -r tests/requirements.txt
      - name: Browser tests and page checks
        run: python tests/run_tests.py --channel chrome

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
